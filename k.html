<head>

<title>Konfirmasi Kehadiran — HUT ke-80 Arhanud</title>
<!--
  HALAMAN KONFIRMASI TAMU (dilayani dari domain sendiri: undangan.arhanud80.online/k.html)
  BUKAN dari script.google.com — supaya bebas dari error Google
  "Sorry, unable to open the file at this time" (masalah sesi /u/1/).

  WAJIB SAMA dengan URL web app Apps Script di bawah.
  Kalau URL /exec berubah, ganti const WEBAPP lalu push ulang.
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;margin:0;padding:0}
  body{font-family:Arial,Helvetica,sans-serif;background:#050505;color:#fff;overflow-x:hidden}
  .page{width:100%;min-height:100dvh;padding:clamp(5px,1.2vw,10px);position:relative;overflow:hidden;
        background:radial-gradient(circle at 50% 0%,#303030 0%,#101010 43%,#000 100%)}
  .page:before{content:"";position:absolute;inset:clamp(4px,1vw,7px);border:2px solid #d8aa2b;
        border-radius:clamp(16px,4vw,24px);pointer-events:none}
  .content{position:relative;z-index:2;width:100%;min-height:100dvh;display:flex;flex-direction:column;
        justify-content:center;align-items:center;padding:14px 10px 26px}
  .logo-area{width:100%;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
  .logo{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));display:block}
  .welcome{width:100%;text-align:center;margin-bottom:4px}
  .welcome-small{color:#d8aa2b;font-size:clamp(12px,3.6vw,16px);font-weight:800;letter-spacing:clamp(1px,.4vw,2px)}
  .welcome-big{color:#f2c63d;font-size:clamp(22px,6.8vw,34px);font-weight:900;letter-spacing:.5px;line-height:1}
  .card{width:min(94vw,600px);border:1px solid #d8aa2b;border-radius:16px;padding:clamp(14px,2.5dvh,22px) clamp(14px,4vw,24px);
        background:linear-gradient(145deg,rgba(32,32,32,.98),rgba(7,7,7,.99));box-shadow:0 0 16px rgba(216,170,43,.10);margin-top:10px}
  .title{text-align:center;color:#fff;font-size:clamp(19px,5.8vw,26px);font-weight:900;margin:0 0 2px}
  .subtitle{text-align:center;color:#d8aa2b;font-size:clamp(13px,4.2vw,17px);font-weight:800;margin-bottom:clamp(8px,1.5dvh,14px)}
  label.field-label{display:block;margin:clamp(8px,1.2dvh,12px) 0 4px;color:#f1c63d;font-size:clamp(14px,4.2vw,17px);font-weight:800}
  input[type=text],input[type=number],textarea{width:100%;border:1px solid #777;border-radius:9px;outline:none;background:#111;
        color:#fff;font-size:clamp(17px,5vw,20px);padding:clamp(9px,1.7dvh,14px) 12px}
  input[type=text],input[type=number]{height:clamp(46px,7.2dvh,56px)}
  textarea{min-height:44px;resize:none;font-size:clamp(15px,4.4vw,17px)}
  input:focus,textarea:focus{border-color:#f2c63d;box-shadow:0 0 8px rgba(216,170,43,.25)}
  .radio-group{display:flex;gap:8px}
  .radio-option{flex:1;min-height:clamp(48px,7.4dvh,58px);padding:6px 4px;display:flex;align-items:center;justify-content:center;
        text-align:center;color:#eee;background:#111;border:1px solid #777;border-radius:9px;cursor:pointer;
        font-size:clamp(15px,4.4vw,17px);font-weight:900}
  .radio-option input{width:clamp(18px,5.5vw,22px);height:clamp(18px,5.5vw,22px);margin:0 7px 0 0;accent-color:#d8aa2b;flex:none}
  .radio-option:has(input:checked){border-color:#f2c63d;color:#f2c63d;background:rgba(216,170,43,.12)}
  button{width:100%;min-height:clamp(50px,7.8dvh,62px);margin-top:clamp(10px,1.6dvh,16px);padding:9px 10px;
        border:1px solid #f1c63d;border-radius:9px;background:linear-gradient(180deg,#f0c33a,#b68716);
        color:#090909;font-size:clamp(17px,5vw,20px);font-weight:900;cursor:pointer}
  button:disabled{opacity:.65;cursor:wait}
  #pesan{display:none;margin-top:10px;padding:14px;border:1px solid #d8aa2b;border-radius:10px;text-align:center;
        background:rgba(216,170,43,.08);color:#f2c63d;line-height:1.45;font-size:clamp(15px,4.5vw,18px)}
  .qrbox{background:#fff;border-radius:14px;padding:16px;display:inline-block}
  .qrbox img{width:220px;height:220px;display:block;max-width:70vw;max-height:70vw;height:auto}
  .small{font-size:clamp(12px,3.6vw,14px);color:#cfc6a5;line-height:1.4}
  .errbox{border:1px solid #c0392b;background:rgba(192,57,43,.12);color:#ff8a7a}
  .footer{text-align:center;margin:10px 4px 0;color:#777;font-size:clamp(9px,2.8vw,12px);line-height:1.25}
  .footer strong{color:#d8aa2b}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.25);border-top-color:#090909;
        border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

    <div class="welcome">
      <div class="welcome-small">SELAMAT DATANG DI</div>
      <div class="welcome-big">PUSSENARHANUD</div>
    </div>

    <div class="card" id="kartu">
      <div class="title">KONFIRMASI KEHADIRAN</div>
      <div class="subtitle">HUT KE-80 ARHANUD TNI AD</div>

      <!-- Mode 1: FORM KONFIRMASI -->
      <form id="formKonfirmasi" style="display:none">
        <label class="field-label">NAMA TAMU</label>
        <input type="text" id="nama" placeholder="Masukkan nama lengkap" autocomplete="name" required>

        <label class="field-label">KONFIRMASI KEHADIRAN</label>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="kehadiran" value="HADIR" onchange="ubahJumlah()">HADIR</label>
          <label class="radio-option"><input type="radio" name="kehadiran" value="TIDAK HADIR" onchange="ubahJumlah()">TIDAK HADIR</label>
        </div>

        <div id="jumlahBox">
          <label class="field-label">JUMLAH HADIR <span style="color:#777;font-weight:normal">(termasuk Bapak/Ibu)</span></label>
          <input type="number" id="jumlah" min="1" max="20" value="1" inputmode="numeric">
        </div>

        <label class="field-label">KETERANGAN <span style="color:#777;font-weight:normal">(opsional)</span></label>
        <textarea id="keterangan" placeholder="Keterangan jika diperlukan"></textarea>

        <button type="submit" id="btnKirim">KIRIM KONFIRMASI</button>
      </form>

      <!-- Mode 2: HASIL / KARTU QR -->
      <div id="pesan"></div>
    </div>

    <div class="footer">
      <strong>HUT KE-80 ARHANUD TNI AD</strong><br>
      Konfirmasi kehadiran untuk keperluan pendataan panitia.
    </div>
  </div>
</div>

<script>
// ===== URL WEB APP APPS SCRIPT (backend) — samakan bila URL /exec berubah =====
var WEBAPP = "https://script.google.com/macros/s/AKfycbzYva5UXoRGtDmT0izrG4RaM4zwpklYDnK4O0ZgoON31nUj0ZEfJsxXPd9PZryIzFPSUw/exec";

var params = new URLSearchParams(location.search);
var TOK = (params.get("t") || "").trim();
var QR  = (params.get("qr") || "").trim();
var pNama = (params.get("nama") || "").trim();
var pJumlah = (params.get("jumlah") || "1").trim();
var pHp = (params.get("p") || "").trim();

function ubahJumlah(){
  var p = document.querySelector('input[name=kehadiran]:checked');
  var box = document.getElementById("jumlahBox");
  if(p && p.value === "TIDAK HADIR"){ box.style.display = "none"; }
  else { box.style.display = "block"; }
}

function showQr(token, judul, catatan){
  var p = document.getElementById("pesan");
  p.innerHTML = '<div class="success-icon" style="font-size:30px;margin-bottom:2px">✓</div>'
    + '<strong>' + judul + '</strong><br><br>'
    + '<div class="qrbox"><img alt="Kode QR Kehadiran" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=' + encodeURIComponent(token) + '"></div>'
    + '<br><div class="small">' + catatan + '</div>';
  p.style.display = "block";
}

function tampilkanError(msg){
  var p = document.getElementById("pesan");
  p.innerHTML = '<strong>⚠ PERHATIAN</strong><br><br><span class="small">' + msg + '</span>';
  p.style.display = "block";
  p.classList.add("errbox");
}

function kirimJsonp(qs, onOk, onErr, timeoutMs){
  var cbName = "_kcb" + Math.floor(Math.random() * 1e9);
  var s = document.createElement("script");
  var done = false;
  var timer = setTimeout(function(){
    if(done) return; done = true; bersih();
    onErr("Koneksi ke server tidak merespons. Coba lagi / periksa internet.");
  }, timeoutMs || 45000);
  function bersih(){ clearTimeout(timer); try{ if(s.parentNode) s.parentNode.removeChild(s); }catch(e){} }
  window[cbName] = function(res){ if(done) return; done = true; bersih(); onOk(res); };
  s.onerror = function(){ if(done) return; done = true; bersih(); onErr("Gagal menghubungi server. Coba lagi."); };
  s.src = WEBAPP + "?mode=konfirmasi&cb=" + cbName + "&" + qs;
  document.head.appendChild(s);
}

function isiFormDariLink(){
  var el = document.getElementById("nama");
  if(pNama && el && !el.value) el.value = pNama;
  var el2 = document.getElementById("jumlah");
  if(pJumlah && el2 && (el2.value === "1" || !el2.value)) el2.value = pJumlah;
}

// ---------- MODE KARTU QR LANGSUNG (?qr=TOKEN) ----------
if(QR){
  document.title = "Kartu QR — HUT ke-80 Arhanud";
  showQr(QR, "KARTU QR KEHADIRAN",
    "Tunjukkan kode QR ini saat tiba di lokasi.<br>Screenshot / simpan gambar ini.");
  document.getElementById("formKonfirmasi").style.display = "none";
} else if(!TOK){
  document.getElementById("formKonfirmasi").style.display = "none";
  tampilkanError("Link undangan tidak lengkap. Silakan minta link baru kepada panitia.<br><br>HUT ke-80 Arhanud — Terima kasih.");
} else {
  // ---------- MODE FORM KONFIRMASI ----------
  isiFormDariLink();
  document.getElementById("formKonfirmasi").style.display = "block";
}

document.getElementById("formKonfirmasi").addEventListener("submit", function(e){
  e.preventDefault();
  var p = document.querySelector('input[name=kehadiran]:checked');
  if(!p){ alert("Silakan pilih konfirmasi kehadiran."); return; }
  var nama = document.getElementById("nama").value.trim();
  if(!nama){ alert("Nama tamu wajib diisi."); return; }
  var jumlah = 1;
  if(p.value === "HADIR"){
    jumlah = Number(document.getElementById("jumlah").value || 0);
    if(jumlah < 1){ alert("Jumlah hadir minimal 1 orang."); return; }
    if(jumlah > 20){ alert("Jumlah hadir maksimal 20 orang."); return; }
  } else { jumlah = 0; }

  var btn = document.getElementById("btnKirim");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>MENYIMPAN KONFIRMASI...';

  var qs = "t=" + encodeURIComponent(TOK)
    + "&nama=" + encodeURIComponent(nama)
    + "&kehadiran=" + encodeURIComponent(p.value)
    + "&jumlah=" + encodeURIComponent(jumlah)
    + "&ket=" + encodeURIComponent(document.getElementById("keterangan").value.trim())
    + (pHp ? "&p=" + encodeURIComponent(pHp) : "");

  kirimJsonp(qs, function(res){
    if(!res || !res.ok){
      var m = (res && res.error) ? res.error : "Konfirmasi gagal disimpan. Silakan coba lagi.";
      alert("Konfirmasi gagal: " + m);
      btn.disabled = false;
      btn.innerHTML = "KIRIM KONFIRMASI";
      return;
    }
    document.getElementById("formKonfirmasi").style.display = "none";
    var catatan = "Data kehadiran telah tersimpan";
    if(res.wa === "sent"){
      catatan += " — <strong>kartu QR telah dikirim ke WhatsApp Anda.</strong><br><br>Simpan / screenshot QR di bawah sebagai cadangan.";
    } else {
      catatan += ".<br><br>Simpan / screenshot QR di bawah sebagai kartu kehadiran Anda.";
    }
    showQr(TOK, "KONFIRMASI BERHASIL", catatan);
  }, function(msg){
    alert(msg);
    btn.disabled = false;
    btn.innerHTML = "KIRIM KONFIRMASI";
  });
});
</script>
</body>
</html>
