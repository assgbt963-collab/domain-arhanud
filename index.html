<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undangan HUT ke-80 Arhanud</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#050505}
  .wrap{display:flex;flex-direction:column;height:100vh}
  .top{background:#0b0b0b;border-bottom:1px solid #2a2a2a;padding:6px 10px;display:flex;align-items:center;gap:8px}
  .top img{height:36px;width:36px;object-fit:contain;filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
  .top b{color:#d8aa2b;font-size:13px;letter-spacing:1px;flex:1}
  .top button{background:#151515;color:#d8aa2b;border:1px solid #d8aa2b;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
  .top button.on{background:#d8aa2b;color:#111;font-weight:700}
  iframe{flex:1;border:0;width:100%}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img alt="logo" src="https://raw.githubusercontent.com/arhanud80/domain-iframe/main/logo.png">
    <b>HUT ke-80 ARHANUD</b>
    <button id="bIndex" class="on" onclick="go('index')">Form</button>
    <button id="bPanitia" onclick="go('panitia')">Panitia</button>
    <button id="bPetugas" onclick="go('petugas')">Petugas</button>
    <button id="bKoord" onclick="go('koordinator')">Koordinator</button>
  </div>
  <iframe id="f" allow="camera; microphone" referrerpolicy="no-referrer"></iframe>
</div>

<script>
/* ============================================================
   GANTI SATU BARIS INI dengan URL Web App Apps Script Anda
   (dari Deploy -> Manage deployments -> URL .../exec)
   ============================================================ */
var WEBAPP = "https://script.google.com/macros/s/AKfycbzYva5UXoRGtDmT0izrG4RaM4zwpklYDnK4O0ZgoON31nUj0ZEfJsxXPd9PZryIzFPSUw/exec";
var NAV = { index: WEBAPP + "?page=index",
            panitia: WEBAPP + "?page=panitia",
            petugas: WEBAPP + "?page=petugas",
            koordinator: WEBAPP + "?page=koordinator" };

function go(p){
  document.getElementById("f").src = NAV[p];
  ["bIndex","bPanitia","bPetugas","bKoord"].forEach(function(id){
    document.getElementById(id).className = (id === "b" + p.charAt(0).toUpperCase() + p.slice(1)) ? "on" : "";
  });
}
/* rute: undangan.arhanud80.online/          -> form tamu
         undangan.arhanud80.online/#/panitia -> dashboard panitia
         undangan.arhanud80.online/#/petugas -> portal petugas */
var h = location.hash.replace("#/","").toLowerCase();
if (h === "panitia" || h === "petugas" || h === "koordinator") { go(h); } else { go("index"); }
window.onhashchange = function(){
  var p = location.hash.replace("#/","").toLowerCase();
  if (p === "panitia" || p === "petugas" || p === "koordinator") go(p);
};
</script>
</body>
</html>
